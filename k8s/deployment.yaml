apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-tracker-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-tracker-api
  template:
    metadata:
      labels:
        app: task-tracker-api
    spec:
      containers:
        - name: task-tracker-api
          image: task-tracker-api:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: task-tracker-secrets
